name: Build Aimlock Dylib for FreeFire iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Kiem tra code nguon
        uses: actions/checkout@v4

      - name: Cai dat Xcode command line tools
        run: |
          xcode-select --install || true
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer || true

      - name: Cai dat build-essential (tuong duong tren macOS)
        run: |
          brew install gcc make cmake ninja

      - name: Tao thu muc chua ma nguon
        run: |
          mkdir -p src
          cat > src/aimlock.c << 'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <mach/mach.h>
          #include <mach/mach_vm.h>
          #include <pthread.h>

          // Offset tu data.txt
          #define OFFSET_BONE_HEAD_1 0x00080BD5
          #define OFFSET_BONE_HEAD_2 0x000A8771
          #define OFFSET_BONE_HEAD_3 0x001D4B8C

          // Chuoi mau de tim kiem
          const unsigned char bone_pattern[] = {
            0x61, 0x6c, 0x63, 0x43, 0x68, 0x61, 0x74, 0x42,
            0x75, 0x62, 0x62, 0x6c, 0x65, 0x50, 0x6f, 0x73,
            0x28, 0x29, 0x3a, 0x20, 0x62, 0x6f, 0x6e, 0x65,
            0x5f, 0x48, 0x65, 0x61, 0x64, 0x20
          };
          #define PATTERN_SIZE 30

          // Ham doc bo nho
          kern_return_t read_memory(task_t task, mach_vm_address_t address, void *buffer, mach_vm_size_t size) {
            mach_vm_size_t out_size = 0;
            return mach_vm_read_overwrite(task, address, size, (vm_address_t)buffer, &out_size);
          }

          // Ham ghi bo nho
          kern_return_t write_memory(task_t task, mach_vm_address_t address, const void *buffer, mach_vm_size_t size) {
            return mach_vm_write(task, address, (vm_offset_t)buffer, size);
          }

          // Tim kiem pattern trong bo nho
          mach_vm_address_t find_pattern(task_t task, mach_vm_address_t start, mach_vm_size_t size, const unsigned char *pattern, size_t pattern_len) {
            unsigned char *buffer = malloc(size);
            if (!buffer) return 0;

            kern_return_t kr = read_memory(task, start, buffer, size);
            if (kr != KERN_SUCCESS) {
              free(buffer);
              return 0;
            }

            for (mach_vm_address_t i = 0; i <= size - pattern_len; i++) {
              if (memcmp(buffer + i, pattern, pattern_len) == 0) {
                mach_vm_address_t found = start + i;
                free(buffer);
                return found;
              }
            }

            free(buffer);
            return 0;
          }

          // Thread chinh cho aimlock
          void *aimlock_thread(void *arg) {
            task_t task = mach_task_self();
            printf("Aimlock dylib da duoc nap, bat dau tim kiem offset...\n");

            // Quet bo nho cua process hien tai (game)
            mach_vm_address_t region_start = 0x100000000;
            mach_vm_size_t region_size = 0x100000000;

            mach_vm_address_t found_addr = find_pattern(task, region_start, region_size, bone_pattern, PATTERN_SIZE);
            if (found_addr) {
              printf("Tim thay pattern tai dia chi: 0x%llx\n", found_addr);

              // Ghi du lieu thay doi de aimlock
              // Thay doi gia tri bone_Head thanh gia tri aim
              unsigned char aim_data[] = {0x61, 0x69, 0x6d, 0x5f, 0x68, 0x65, 0x61, 0x64};
              kern_return_t kr = write_memory(task, found_addr + 0x10, aim_data, sizeof(aim_data));
              if (kr == KERN_SUCCESS) {
                printf("Da ghi aimlock tai offset: 0x%llx\n", found_addr + 0x10);
              } else {
                printf("Khong the ghi bo nho, error code: %d\n", kr);
              }
            } else {
              printf("Khong tim thay pattern bone_Head trong bo nho\n");
            }

            return NULL;
          }

          // Ham duoc goi khi dylib duoc nap
          __attribute__((constructor)) void init() {
            pthread_t thread;
            pthread_create(&thread, NULL, aimlock_thread, NULL);
            pthread_detach(thread);
          }

          // Ham de tranh canh bao
          void dummy_function() {}
          EOF

      - name: Bien dich ra dylib
        run: |
          gcc -Wall -Wextra -O2 -dynamiclib -install_name @rpath/libaimlock.dylib \
            -framework CoreFoundation -framework IOKit \
            -o libaimlock.dylib src/aimlock.c

      - name: Kiem tra file dylib ton tai
        run: |
          if [ -f "libaimlock.dylib" ]; then
            echo "File libaimlock.dylib duoc tao thanh cong"
            file libaimlock.dylib
            otool -L libaimlock.dylib
            ls -la libaimlock.dylib
          else
            echo "LOI: Khong tim thay libaimlock.dylib"
            exit 1
          fi

      - name: Tinh checksum cho dylib
        run: |
          shasum -a 256 libaimlock.dylib > libaimlock.dylib.sha256
          cat libaimlock.dylib.sha256

      - name: Upload artifact dylib
        uses: actions/upload-artifact@v4
        with:
          name: libaimlock
          path: |
            libaimlock.dylib
            libaimlock.dylib.sha256
          retention-days: 7