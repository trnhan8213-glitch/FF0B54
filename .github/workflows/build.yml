name: Build FreeFire Aimlock Dylib

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        brew install ldid dpkg

    - name: Create Dylib Directory
      run: |
        mkdir -p FreeFireAimlock
        cd FreeFireAimlock

    - name: Create main.c
      run: |
        cd FreeFireAimlock
        cat > main.c << 'EOF'
        #include <stdio.h>
        #include <string.h>
        #include <stdlib.h>
        #include <unistd.h>
        #include <dlfcn.h>
        #include <mach/mach.h>
        #include <mach/vm_map.h>
        #include <mach-o/dyld.h>
        #include <mach-o/loader.h>
        #include <mach-o/nlist.h>
        #include <sys/mman.h>
        #include <sys/types.h>
        #include <sys/stat.h>
        #include <fcntl.h>
        #include <pthread.h>
        #include <TargetConditionals.h>
        #include <objc/runtime.h>
        #include <objc/message.h>

        // Offsets từ global-metadata
        #define OFFSET_ALC_CHAT_BUBBLE_POS 0x00080BD5
        #define OFFSET_AD_COMPONENT_NO_FIND 0x000A8771
        #define OFFSET_BONE_WEIGHT_HEAD 0x001D4B8C

        // Cấu trúc Vector3
        typedef struct {
            float x, y, z;
        } Vector3;

        // Biến toàn cục
        static mach_port_t target_task = MACH_PORT_NULL;
        static uintptr_t base_address = 0;
        static bool aimlock_active = true;
        static float aim_smoothness = 8.0f;

        // Hàm đọc bộ nhớ
        bool read_memory(uintptr_t address, void* buffer, size_t size) {
            if (target_task == MACH_PORT_NULL) return false;
            vm_size_t bytes_read;
            kern_return_t kr = vm_read_overwrite(target_task, address, size, (vm_address_t)buffer, &bytes_read);
            return (kr == KERN_SUCCESS && bytes_read == size);
        }

        // Hàm ghi bộ nhớ
        bool write_memory(uintptr_t address, const void* buffer, size_t size) {
            if (target_task == MACH_PORT_NULL) return false;
            kern_return_t kr = vm_write(target_task, address, (vm_offset_t)buffer, size);
            return (kr == KERN_SUCCESS);
        }

        // Hàm tìm process FreeFire
        bool find_freefire_process() {
            pid_t pid = 0;
            int count = proc_listpids(PROC_ALL_PIDS, 0, NULL, 0);
            if (count <= 0) return false;

            pid_t* pids = (pid_t*)malloc(count * sizeof(pid_t));
            if (!pids) return false;

            proc_listpids(PROC_ALL_PIDS, 0, pids, count * sizeof(pid_t));

            for (int i = 0; i < count; i++) {
                if (pids[i] == 0) continue;

                char path[PATH_MAX];
                proc_pidpath(pids[i], path, sizeof(path));

                if (strstr(path, "FreeFire") != NULL ||
                    strstr(path, "com.dts.freefireth") != NULL) {
                    pid = pids[i];
                    break;
                }
            }
            free(pids);

            if (pid == 0) return false;

            kern_return_t kr = task_for_pid(mach_task_self(), pid, &target_task);
            if (kr != KERN_SUCCESS) {
                // Thử lại với quyền root
                kr = task_for_pid(mach_task_self(), pid, &target_task);
                if (kr != KERN_SUCCESS) return false;
            }

            return true;
        }

        // Hàm tìm base address
        uintptr_t find_base_address() {
            struct task_dyld_info dyld_info;
            mach_msg_type_number_t count = TASK_DYLD_INFO_COUNT;
            kern_return_t kr = task_info(target_task, TASK_DYLD_INFO, (task_info_t)&dyld_info, &count);
            if (kr != KERN_SUCCESS) return 0;

            struct dyld_all_image_infos* infos = (struct dyld_all_image_infos*)dyld_info.all_image_info_addr;
            if (!infos) return 0;

            for (uint32_t i = 0; i < infos->infoArrayCount; i++) {
                const struct dyld_image_info* image = &infos->infoArray[i];
                if (image->imageFilePath &&
                    (strstr(image->imageFilePath, "FreeFire") != NULL ||
                     strstr(image->imageFilePath, "com.dts.freefireth") != NULL)) {
                    return (uintptr_t)image->imageLoadAddress;
                }
            }
            return 0;
        }

        // Hàm patch offset để bypass antiban
        void bypass_antiban() {
            if (target_task == MACH_PORT_NULL || base_address == 0) return;

            // ARM64 RET instruction
            unsigned char ret_inst[] = {0xC0, 0x03, 0x5F, 0xD6};
            // ARM64 NOP instruction
            unsigned char nop_inst[] = {0x1F, 0x20, 0x03, 0xD5};

            // Patch offset 1: alcChatBubblePos -> RET
            uintptr_t addr1 = base_address + OFFSET_ALC_CHAT_BUBBLE_POS;
            write_memory(addr1, ret_inst, sizeof(ret_inst));

            // Patch offset 2: adComponent no find -> NOP + RET
            uintptr_t addr2 = base_address + OFFSET_AD_COMPONENT_NO_FIND;
            write_memory(addr2, nop_inst, sizeof(nop_inst));

            // Patch offset 3: boneWeights -> NOP
            uintptr_t addr3 = base_address + OFFSET_BONE_WEIGHT_HEAD;
            write_memory(addr3, nop_inst, sizeof(nop_inst));

            printf("[FreeFire] Bypass antiban applied at offsets: 0x%lx, 0x%lx, 0x%lx\n",
                   OFFSET_ALC_CHAT_BUBBLE_POS, OFFSET_AD_COMPONENT_NO_FIND, OFFSET_BONE_WEIGHT_HEAD);
        }

        // Tìm pattern bone_Head trong bộ nhớ
        uintptr_t find_bone_head_pattern() {
            if (target_task == MACH_PORT_NULL || base_address == 0) return 0;

            // Duyệt các vùng nhớ của process
            vm_address_t address = base_address;
            vm_size_t size = 0x2000000; // 32MB

            unsigned char pattern[] = "bone_Head";
            size_t pattern_len = strlen((char*)pattern);

            for (uintptr_t addr = address; addr < address + size; addr += 0x1000) {
                unsigned char buffer[1024];
                if (!read_memory(addr, buffer, sizeof(buffer))) continue;

                for (int i = 0; i < sizeof(buffer) - pattern_len; i++) {
                    if (memcmp(buffer + i, pattern, pattern_len) == 0) {
                        return addr + i;
                    }
                }
            }
            return 0;
        }

        // Hàm lấy Camera.main từ Unity
        id get_main_camera() {
            // Lấy UnityAppController
            Class unityAppController = NSClassFromString(@"UnityAppController");
            if (!unityAppController) return nil;

            id controller = [unityAppController performSelector:@selector(sharedInstance)];
            if (!controller) return nil;

            // Lấy main camera
            SEL mainCamSel = NSSelectorFromString(@"mainCamera");
            if (![controller respondsToSelector:mainCamSel]) return nil;

            id mainCamera = [controller performSelector:mainCamSel];
            return mainCamera;
        }

        // Hàm ghim tâm súng vào bone_Head
        void aimlock_to_head() {
            if (!aimlock_active || target_task == MACH_PORT_NULL || base_address == 0) return;

            // Tìm bone_Head trong bộ nhớ
            uintptr_t bone_head_ptr = find_bone_head_pattern();
            if (bone_head_ptr == 0) return;

            // Đọc vị trí bone_Head (Vector3)
            Vector3 head_pos;
            if (!read_memory(bone_head_ptr - 0x20, &head_pos, sizeof(Vector3))) {
                // Thử đọc tại vị trí khác gần pattern
                if (!read_memory(bone_head_ptr - 0x40, &head_pos, sizeof(Vector3))) {
                    return;
                }
            }

            // Lấy Camera.main
            id mainCamera = get_main_camera();
            if (!mainCamera) return;

            // Lấy transform của camera
            SEL transformSel = NSSelectorFromString(@"transform");
            if (![mainCamera respondsToSelector:transformSel]) return;

            id transform = [mainCamera performSelector:transformSel];
            if (!transform) return;

            // Lấy vị trí camera
            SEL positionSel = NSSelectorFromString(@"position");
            if (![transform respondsToSelector:positionSel]) return;

            Vector3 cam_pos;
            NSValue* posValue = [transform performSelector:positionSel];
            if (posValue) {
                [posValue getValue:&cam_pos];
            } else {
                // Fallback: sử dụng objc_msgSend
                void (*getPosition)(id, SEL, Vector3*) = (void (*)(id, SEL, Vector3*))objc_msgSend;
                getPosition(transform, positionSel, &cam_pos);
            }

            // Tính toán hướng nhìn
            Vector3 look_dir = {
                head_pos.x - cam_pos.x,
                head_pos.y - cam_pos.y,
                head_pos.z - cam_pos.z
            };

            // Chuẩn hóa vector
            float len = sqrtf(look_dir.x * look_dir.x + look_dir.y * look_dir.y + look_dir.z * look_dir.z);
            if (len > 0.001f) {
                look_dir.x /= len;
                look_dir.y /= len;
                look_dir.z /= len;
            } else {
                return;
            }

            // Tạo Quaternion từ look_dir
            // Sử dụng Quaternion.LookRotation
            Class quaternionClass = NSClassFromString(@"Quaternion");
            if (!quaternionClass) return;

            SEL lookRotSel = NSSelectorFromString(@"LookRotation:");
            if (![quaternionClass respondsToSelector:lookRotSel]) return;

            // Tạo Vector3 cho hướng nhìn
            Class vector3Class = NSClassFromString(@"Vector3");
            if (!vector3Class) return;

            SEL vec3Sel = NSSelectorFromString(@"vector3WithX:y:z:");
            if (![vector3Class respondsToSelector:vec3Sel]) return;

            // Gọi Vector3.Vector3(x, y, z)
            NSMethodSignature* sig = [vector3Class methodSignatureForSelector:vec3Sel];
            NSInvocation* inv = [NSInvocation invocationWithMethodSignature:sig];
            [inv setTarget:vector3Class];
            [inv setSelector:vec3Sel];
            float x = look_dir.x, y = look_dir.y, z = look_dir.z;
            [inv setArgument:&x atIndex:2];
            [inv setArgument:&y atIndex:3];
            [inv setArgument:&z atIndex:4];
            [inv invoke];
            id vec3Result;
            [inv getReturnValue:&vec3Result];

            if (!vec3Result) return;

            // Gọi Quaternion.LookRotation(vec3)
            NSMethodSignature* lookSig = [quaternionClass methodSignatureForSelector:lookRotSel];
            NSInvocation* lookInv = [NSInvocation invocationWithMethodSignature:lookSig];
            [lookInv setTarget:quaternionClass];
            [lookInv setSelector:lookRotSel];
            [lookInv setArgument:&vec3Result atIndex:2];
            [lookInv invoke];
            id quatResult;
            [lookInv getReturnValue:&quatResult];

            if (!quatResult) return;

            // Set rotation cho camera
            SEL rotationSel = NSSelectorFromString(@"rotation");
            if ([transform respondsToSelector:rotationSel]) {
                [transform setValue:quatResult forKey:@"rotation"];
            } else {
                // Fallback: sử dụng objc_msgSend
                void (*setRotation)(id, SEL, id) = (void (*)(id, SEL, id))objc_msgSend;
                setRotation(transform, rotationSel, quatResult);
            }
        }

        // Thread aimlock
        void* aimlock_thread_func(void* arg) {
            while (1) {
                if (aimlock_active) {
                    aimlock_to_head();
                }
                usleep(5000); // 5ms
            }
            return NULL;
        }

        // Constructor - tự động chạy khi dylib được load
        __attribute__((constructor))
        void init_freefire_aimlock() {
            printf("[FreeFire] Aimlock dylib loading...\n");

            // Tìm process FreeFire
            if (!find_freefire_process()) {
                printf("[FreeFire] Cannot find FreeFire process\n");
                return;
            }
            printf("[FreeFire] Found FreeFire process\n");

            // Tìm base address
            base_address = find_base_address();
            if (base_address == 0) {
                printf("[FreeFire] Cannot find base address\n");
                return;
            }
            printf("[FreeFire] Base address: 0x%lx\n", base_address);

            // Bypass antiban
            bypass_antiban();
            printf("[FreeFire] Anti-ban bypass activated\n");

            // Kích hoạt aimlock
            aimlock_active = true;

            // Tạo thread aimlock
            pthread_t thread;
            if (pthread_create(&thread, NULL, aimlock_thread_func, NULL) == 0) {
                pthread_detach(thread);
                printf("[FreeFire] Aimlock thread created\n");
            } else {
                printf("[FreeFire] Failed to create aimlock thread\n");
            }

            printf("[FreeFire] Aimlock dylib loaded successfully\n");
            printf("[FreeFire] Offsets: ALC=0x%X, AD=0x%X, BW=0x%X\n",
                   OFFSET_ALC_CHAT_BUBBLE_POS, OFFSET_AD_COMPONENT_NO_FIND, OFFSET_BONE_WEIGHT_HEAD);
        }
        EOF

    - name: Compile Dylib
      run: |
        cd FreeFireAimlock
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        clang -arch arm64 -isysroot $SDK_PATH -dynamiclib \
          -compatibility_version 1.0 -current_version 1.0 \
          -o FreeFireAimlock.dylib main.c \
          -framework Foundation -framework UIKit -framework CoreGraphics \
          -mios-version-min=13.0 -O2 \
          -undefined dynamic_lookup

    - name: Strip Dylib
      run: |
        cd FreeFireAimlock
        strip -S FreeFireAimlock.dylib || true
        ls -la FreeFireAimlock.dylib
        file FreeFireAimlock.dylib
        otool -L FreeFireAimlock.dylib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FreeFireAimlock
        path: FreeFireAimlock/FreeFireAimlock.dylib