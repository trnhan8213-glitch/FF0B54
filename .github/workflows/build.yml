# .github/workflows/build.yml
name: Build iOS dylib (Aimlock + Menu Liquid Glass)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Tạo mã nguồn Aimlock.m (Objective-C)
        run: |
          mkdir -p src
          cat > src/Aimlock.m << 'EOF'
          // Aimlock.m – Dylib tiêm FreeFire, hiển thị menu Liquid Glass
          // 3 chức năng: Aimlock, Aimdrag, Aimbot

          #import <UIKit/UIKit.h>
          #import <Foundation/Foundation.h>
          #import <objc/runtime.h>
          #import <dlfcn.h>

          // ========== MENU LIQUID GLASS ==========
          @interface LiquidGlassMenu : UIViewController
          @property (nonatomic, strong) UIView *menuView;
          @property (nonatomic, strong) UIButton *aimlockBtn;
          @property (nonatomic, strong) UIButton *aimdragBtn;
          @property (nonatomic, strong) UIButton *aimbotBtn;
          @property (nonatomic, assign) BOOL aimlockOn;
          @property (nonatomic, assign) BOOL aimdragOn;
          @property (nonatomic, assign) BOOL aimbotOn;
          @end

          @implementation LiquidGlassMenu

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor clearColor];
              self.modalPresentationStyle = UIModalPresentationOverCurrentContext;
              [self setupMenu];
          }

          - (void)setupMenu {
              CGFloat w = [UIScreen mainScreen].bounds.size.width / 3;
              CGFloat h = w * 1.1;
              CGFloat x = ([UIScreen mainScreen].bounds.size.width - w) / 2;
              CGFloat y = ([UIScreen mainScreen].bounds.size.height - h) / 2;

              self.menuView = [[UIView alloc] initWithFrame:CGRectMake(x, y, w, h)];
              self.menuView.backgroundColor = [UIColor colorWithWhite:1.0 alpha:0.15];
              self.menuView.layer.cornerRadius = 25;
              self.menuView.layer.borderWidth = 1;
              self.menuView.layer.borderColor = [UIColor colorWithWhite:1.0 alpha:0.3].CGColor;
              // Glass effect
              UIBlurEffect *blur = [UIBlurEffect effectWithStyle:UIBlurEffectStyleLight];
              UIVisualEffectView *blurView = [[UIVisualEffectView alloc] initWithEffect:blur];
              blurView.frame = self.menuView.bounds;
              blurView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              blurView.layer.cornerRadius = 25;
              blurView.clipsToBounds = YES;
              [self.menuView addSubview:blurView];

              // Title
              UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(0, 8, w, 28)];
              title.text = @"AIM TOOL";
              title.textColor = [UIColor whiteColor];
              title.font = [UIFont boldSystemFontOfSize:16];
              title.textAlignment = NSTextAlignmentCenter;
              [self.menuView addSubview:title];

              // Buttons
              CGFloat btnW = w * 0.8;
              CGFloat btnH = 34;
              CGFloat spacing = 10;
              CGFloat startY = 44;
              NSArray *titles = @[@"Aimlock", @"Aimdrag", @"Aimbot"];
              for (int i = 0; i < 3; i++) {
                  UIButton *btn = [UIButton buttonWithType:UIButtonTypeSystem];
                  btn.frame = CGRectMake((w - btnW)/2, startY + i*(btnH+spacing), btnW, btnH);
                  [btn setTitle:titles[i] forState:UIControlStateNormal];
                  [btn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                  btn.titleLabel.font = [UIFont systemFontOfSize:14 weight:UIFontWeightMedium];
                  btn.backgroundColor = [UIColor colorWithWhite:0.0 alpha:0.3];
                  btn.layer.cornerRadius = 10;
                  btn.layer.borderWidth = 0.5;
                  btn.layer.borderColor = [UIColor colorWithWhite:1.0 alpha:0.2].CGColor;
                  btn.tag = 100 + i;
                  [btn addTarget:self action:@selector(buttonTapped:) forControlEvents:UIControlEventTouchUpInside];
                  [self.menuView addSubview:btn];
              }
              // Gán tham chiếu
              self.aimlockBtn = [self.menuView viewWithTag:100];
              self.aimdragBtn = [self.menuView viewWithTag:101];
              self.aimbotBtn = [self.menuView viewWithTag:102];

              // Close button (vòng tròn nhỏ)
              UIButton *closeBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              closeBtn.frame = CGRectMake(w-30, 4, 24, 24);
              [closeBtn setTitle:@"✕" forState:UIControlStateNormal];
              [closeBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              closeBtn.titleLabel.font = [UIFont systemFontOfSize:18];
              closeBtn.backgroundColor = [UIColor colorWithWhite:0.0 alpha:0.4];
              closeBtn.layer.cornerRadius = 12;
              [closeBtn addTarget:self action:@selector(closeMenu) forControlEvents:UIControlEventTouchUpInside];
              [self.menuView addSubview:closeBtn];

              [self.view addSubview:self.menuView];
          }

          - (void)buttonTapped:(UIButton *)sender {
              NSInteger idx = sender.tag - 100;
              switch (idx) {
                  case 0: {
                      self.aimlockOn = !self.aimlockOn;
                      [sender setTitleColor:self.aimlockOn ? [UIColor systemGreenColor] : [UIColor whiteColor] forState:UIControlStateNormal];
                      // Gọi hook aimlock
                      [self performSelector:@selector(toggleAimlock) withObject:nil afterDelay:0];
                      break;
                  }
                  case 1: {
                      self.aimdragOn = !self.aimdragOn;
                      [sender setTitleColor:self.aimdragOn ? [UIColor systemGreenColor] : [UIColor whiteColor] forState:UIControlStateNormal];
                      // Hook aimdrag
                      break;
                  }
                  case 2: {
                      self.aimbotOn = !self.aimbotOn;
                      [sender setTitleColor:self.aimbotOn ? [UIColor systemGreenColor] : [UIColor whiteColor] forState:UIControlStateNormal];
                      // Hook aimbot
                      break;
                  }
              }
          }

          - (void)closeMenu {
              [self dismissViewControllerAnimated:YES completion:nil];
          }

          // Các hàm thực thi hook (giả lập)
          - (void)toggleAimlock {
              // Viết logic ghi nhớ offset
              // Ví dụ: uintptr_t base = (uintptr_t)dlopen(NULL, RTLD_NOW);
              // *(uint32_t*)(base + 0x123456) = self.aimlockOn ? 1 : 0;
              NSLog(@"Aimlock toggled: %d", self.aimlockOn);
          }

          @end

          // ========== TRIGGER HIỂN THỊ MENU ==========
          static UIWindow *overlayWindow = nil;
          static LiquidGlassMenu *menuVC = nil;

          // Hàm hiển thị menu (gọi từ constructor)
          void showMenu() {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (overlayWindow) return;
                  UIWindow *keyWindow = [UIApplication sharedApplication].keyWindow;
                  overlayWindow = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
                  overlayWindow.windowLevel = UIWindowLevelAlert + 1;
                  overlayWindow.backgroundColor = [UIColor clearColor];
                  overlayWindow.rootViewController = [[UIViewController alloc] init];
                  overlayWindow.rootViewController.view.backgroundColor = [UIColor clearColor];
                  [overlayWindow makeKeyAndVisible];

                  menuVC = [[LiquidGlassMenu alloc] init];
                  // Hiển thị menu như popup
                  [overlayWindow.rootViewController presentViewController:menuVC animated:YES completion:nil];

                  // Sau 30s tự đóng (tùy chọn)
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(30 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                      [menuVC closeMenu];
                  });
              });
          }

          // Hook vào applicationDidFinishLaunching để hiển thị menu
          static void (*orig_applicationDidFinishLaunching)(id self, SEL _cmd, id application);
          void new_applicationDidFinishLaunching(id self, SEL _cmd, id application) {
              orig_applicationDidFinishLaunching(self, _cmd, application);
              showMenu(); // hiển thị menu sau khi app khởi động
          }

          // Constructor – swizzle
          __attribute__((constructor)) void init_dylib() {
              NSLog(@"[Aimlock] Dylib loaded. Swizzling...");
              // Method swizzle cho AppDelegate
              Class appDelegateClass = NSClassFromString(@"AppDelegate");
              if (!appDelegateClass) {
                  // Tìm class nào có application:didFinishLaunchingWithOptions:
                  // Hoặc dùng hook UIApplication
                  NSLog(@"AppDelegate not found, trying UIApplication");
                  // Hook didFinishLaunchingNotification
                  [[NSNotificationCenter defaultCenter] addObserverForName:UIApplicationDidFinishLaunchingNotification
                                                                     object:nil queue:nil
                                                                usingBlock:^(NSNotification *note) {
                                                                    showMenu();
                                                                }];
              } else {
                  SEL origSel = @selector(application:didFinishLaunchingWithOptions:);
                  Method origMethod = class_getInstanceMethod(appDelegateClass, origSel);
                  if (origMethod) {
                      // Swizzle không cần thiết, chỉ cần thêm observer
                      [[NSNotificationCenter defaultCenter] addObserverForName:UIApplicationDidFinishLaunchingNotification
                                                                         object:nil queue:nil
                                                                    usingBlock:^(NSNotification *note) {
                                                                        showMenu();
                                                                    }];
                  }
              }
          }

          EOF

      - name: Biên dịch dylib với Objective-C và UIKit
        run: |
          export SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          export CC=$(xcrun --sdk iphoneos -f clang)
          $CC -arch arm64 -dynamiclib -isysroot $SDKROOT \
              -miphoneos-version-min=14.0 \
              -framework UIKit -framework Foundation \
              -Wl,-undefined,dynamic_lookup \
              -x objective-c -O2 -o aimlock.dylib src/Aimlock.m

      - name: Kiểm tra output
        run: file aimlock.dylib && ls -la aimlock.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aimlock-FreeFire-Menu
          path: aimlock.dylib

      - name: Tạo hướng dẫn
        run: |
          echo "Sau khi tiêm, khởi động FreeFire, menu sẽ hiện lên tự động." > guide.txt
          echo "Bấm vào nút tròn để mở menu vuông 1/3 màn hình." >> guide.txt
          echo "Chọn chức năng: Aimlock, Aimdrag, Aimbot (màu xanh là bật)." >> guide.txt

      - name: Upload guide
        uses: actions/upload-artifact@v4
        with:
          name: guide
          path: guide.txt
